<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- The "Aura" Ring -->
  <circle cx="256" cy="256" r="140" stroke="url(#aura-grad)" stroke-width="32" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" stroke="url(#aura-grad-2)" stroke-width="12" />
  
  <!-- Subtle inner core -->
  <circle cx="256" cy="256" r="110" fill="url(#inner-glow)" />

  <defs>
    <!-- Midnight / Obsidian Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#080912" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Main Aura Gradient -->
    <linearGradient id="aura-grad" x1="100" y1="100" x2="412" y2="412">
      <stop offset="0%" stop-color="#6c9ef8" />
      <stop offset="50%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#d4a44c" />
    </linearGradient>

    <!-- Sharp Highlight Gradient -->
    <linearGradient id="aura-grad-2" x1="412" y1="100" x2="100" y2="412">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="inner-glow" cx="256" cy="256" r="110" fx="256" fy="256">
      <stop offset="0%" stop-color="rgba(108, 158, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(108, 158, 248, 0)" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
